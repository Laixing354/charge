<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>充电桩速查</title>
<meta name="description" content="不用现场扫码，点击即可看到校园充电桩的情况。">
<meta property="og:title" content="充电桩速查">
<meta property="og:description" content="不用现场扫码，点击即可看到校园充电桩的情况。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://laixing354.github.io/charge/share.png">
<link rel="icon" href="share.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: 单栏手机列表。顶部搜索和区域筛选，下面每行一个桩，主按钮直达联横充电的选择插口页。 */
:root {
  color-scheme: light;
  --bg: #f2f4f1;
  --surface: #ffffff;
  --ink: #17211d;
  --muted: #5c6a64;
  --line: #d9dfdb;
  --accent: #f2b705;      /* 桩上贴纸的黄色 */
  --on-accent: #1a1500;
  --tag-bg: #fff1bd;
  --tag-fg: #5f4900;
  --focus: #1f6f5a;
  --danger: #b3261e;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --surface: #1b211e; --ink: #eaefec; --muted: #98a59e; --line: #2c3631;
    --tag-bg: #3a3210; --tag-fg: #f6d567; --focus: #f2b705; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1b211e; --ink: #eaefec; --muted: #98a59e; --line: #2c3631;
  --tag-bg: #3a3210; --tag-fg: #f6d567; --focus: #f2b705; --danger: #ff8a80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 22px; line-height: 1.3; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

input[type="text"], input[type="search"], textarea {
  width: 100%; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 12px;
}
textarea { resize: vertical; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 4px 12px; font-size: 13px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; letter-spacing: 0.04em; }

.list { display: flex; flex-direction: column; gap: 8px; padding: 0; margin: 0; list-style: none; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.star { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 4px; }
.star[aria-pressed="true"] { color: var(--accent); }
.name { flex: 1; min-width: 0; }
.name b { display: block; font-weight: 700; overflow-wrap: anywhere; }
.name span { color: var(--muted); font-size: 12px; }
.code { font-family: var(--font-mono); font-weight: 600; font-size: 13px; background: var(--tag-bg); color: var(--tag-fg); padding: 2px 8px; border-radius: 4px; letter-spacing: 0.04em; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.go {
  flex: 1 1 140px; text-align: center; text-decoration: none;
  background: var(--accent); color: var(--on-accent); font-weight: 700;
  padding: 10px 14px; border-radius: 6px;
}
.go:active { filter: brightness(0.92); }
.ghost { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 9px 12px; font-size: 13px; cursor: pointer; }
.ghost.warn { color: var(--danger); border-color: var(--danger); }

.row.dim { opacity: 0.6; }
.photo { display: block; flex: none; width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); cursor: zoom-in; }
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 80%; object-fit: contain; border-radius: 6px; }
.lightbox p { margin: 0; color: #fff; font-size: 14px; text-align: center; }
.toggle { align-self: flex-start; }
.row .acts { flex-wrap: nowrap; gap: 6px; }
.row .go { flex: 1 1 auto; min-width: 0; padding: 10px 8px; white-space: nowrap; }
.row .ghost { flex: none; padding: 9px 10px; white-space: nowrap; }
@media (max-width: 340px) { .row .acts { flex-wrap: wrap; } }
.note { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); background: var(--bg); padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.donate { align-self: flex-start; }
.credit { font-weight: 500; color: var(--ink); }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 24px 16px; text-align: center; color: var(--muted); }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
summary { padding: 12px; font-weight: 500; cursor: pointer; }
.pane { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.pane label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.pane .hint { font-size: 12px; color: var(--muted); margin: 0; }
.btn { background: var(--ink); color: var(--bg); border: 0; border-radius: 6px; padding: 10px 14px; font-weight: 500; cursor: pointer; align-self: flex-start; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px;
  max-width: calc(100% - 32px);
}
.foot { color: var(--muted); font-size: 12px; margin: 0; }
</style>
</head>
<body>
<div style="position:absolute;left:-9999px;top:0;width:300px;height:300px;overflow:hidden" aria-hidden="true"><img src="share.png" width="300" height="300" alt=""></div>
<div class="wrap">
  <header>
    <h1>充电桩速查</h1>
    <p class="sub">不用现场扫码。在微信中打开本页，点“查看空位”，即可查看充电桩的使用情况，并正常充电。</p>
    <p class="sub">提示：一次看一个桩，隔几秒再点下一个，避免连续快速点击，造成提示“操作过于频繁”并暂时限制账号查看权限。</p>
  </header>

  <input type="search" id="q" placeholder="搜索名称、位置或桩编号" autocomplete="off" aria-label="搜索充电桩">
  <div class="chips" id="chips" role="group" aria-label="按区域筛选"></div>
  <div class="meta"><span id="count"></span><span id="sync"></span></div>

  <ul class="list" id="list"></ul>
  <button class="ghost toggle" type="button" id="toggle-hidden" hidden></button>

  <details id="addBox">
    <summary>添加自己需要的其他充电桩</summary>
    <form class="pane" id="form" autocomplete="off">
      <label for="f-code">充电桩编号（二维码下面，如 G443444）
        <input type="text" id="f-code" inputmode="latin" autocapitalize="characters" required>
      </label>
      <label for="f-name">名称
        <input type="text" id="f-name" placeholder="如：3号楼东侧 2号桩" required>
      </label>
      <label for="f-area">区域
        <input type="text" id="f-area" list="areas" placeholder="如：3号楼、操场、图书馆">
        <datalist id="areas"></datalist>
      </label>
      <label for="f-note">位置说明（可选）
        <input type="text" id="f-note" placeholder="如：宿舍楼东门出来左转，车棚旁边">
      </label>
      <button class="btn" type="submit" id="f-submit">保存</button>
      <p class="hint">想让所有人都看到，可联系管理员。</p>
    </form>
  </details>

  <details>
    <summary>批量导入</summary>
    <div class="pane">
      <label for="bulk">每行一个桩，格式：编号 名称 区域 位置说明（后两项可省略，用空格隔开）。导入后只在自己的手机可见。
        <textarea id="bulk" rows="5" placeholder="G443444 3号楼东侧1号 3号楼&#10;G443445 3号楼东侧2号 3号楼"></textarea>
      </label>
      <button class="btn" type="button" id="bulk-go">导入</button>
      <div id="adminBox" class="pane" style="padding:0" hidden>
        <label for="backup">【管理员】当前全部充电桩，复制后粘贴到 piles.txt
          <textarea id="backup" rows="6" readonly></textarea>
        </label>
        <button class="btn" type="button" id="backup-copy">复制全部</button>
      </div>
    </div>
  </details>

  <div class="acts">
    <button class="ghost" type="button" id="contact" hidden>联系作者</button>
    <button class="ghost donate" type="button" id="donate" hidden>赞赏作者</button>
  </div>

  <p class="foot credit">制作：某某同学</p>

  <p class="foot">每次打开自动更新。收藏、删除和“我自己的桩”只保存在自己手机的浏览器里，清理缓存会丢失。本页面是个人制作的小工具。</p>
</div>
<div class="toast" id="toast" hidden></div>
<div class="lightbox" id="lightbox" hidden><img id="lb-img" alt=""><p id="lb-cap"></p></div>

<script>
(function () {
  var BASE = 'https://www.washpayer.com/user/index.html#/pages/device/selectPort?chargeIndex=&logicalCode=';
  var K_MINE = 'charge-mine-v1', K_FAVS = 'charge-favs-v1', K_SHARED = 'charge-shared-v1', K_OLD = 'charge-piles-v1', K_HIDDEN = 'charge-hidden-v1', K_OVR = 'charge-ovr-v1';
  var DEFAULT_AREA = '未分组';

  var shared = readJSON(K_SHARED, []);   // 来自 piles.txt（上次成功读取的缓存）
  var mine = [];                          // 我自己添加的
  var favs = [];                          // 收藏的编号
  var hidden = [];                        // 我在自己手机上删除的编号
  var ovr = [];                           // 我对共享桩名称/区域的修改（只在自己手机上）
  var showHidden = false;
  var syncMsg = '列表读取中…';
  var query = '', area = '全部', pendingDelete = null, toastTimer = null, openNotes = {};

  var $ = function (id) { return document.getElementById(id); };

  function readJSON(key, fallback) {
    try {
      var s = localStorage.getItem(key);
      if (s) { var v = JSON.parse(s); if (Array.isArray(v)) return v; }
    } catch (e) {}
    return fallback;
  }
  function writeJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

  function initLocal() {
    mine = readJSON(K_MINE, null);
    favs = readJSON(K_FAVS, []);
    hidden = readJSON(K_HIDDEN, []);
    ovr = readJSON(K_OVR, []);
    if (mine === null) {
      // 从旧版本迁移：旧版把全部桩和收藏都存在一起
      mine = [];
      var old = readJSON(K_OLD, []);
      old.forEach(function (p) {
        if (!p || !p.code || /^示例桩/.test(p.name || '')) return;
        mine.push({ code: p.code, name: p.name || p.code, area: p.area || DEFAULT_AREA });
        if (p.fav && favs.indexOf(p.code) === -1) favs.push(p.code);
      });
      writeJSON(K_MINE, mine); writeJSON(K_FAVS, favs);
    }
  }

  function normCode(s) { return String(s || '').trim().toUpperCase(); }
  function validCode(s) { return /^[A-Z0-9_-]{3,32}$/.test(s); }
  function linkOf(code) { return BASE + encodeURIComponent(code); }

  // 解析文本：每行 编号 名称 区域；# 开头为注释
  function parseText(text) {
    var out = [];
    String(text || '').split(/\r?\n/).forEach(function (line) {
      line = line.trim();
      if (!line || line.charAt(0) === '#') return;
      var m = line.match(/^([^\s,，]+)(?:[\s,，]+([^\s,，]+))?(?:[\s,，]+([^\s,，]+))?(?:[\s,，]+(.+))?$/);
      var code = m ? normCode(m[1]) : '';
      if (!validCode(code)) { out.push(null); return; }
      out.push({ code: code, name: m[2] || code, area: m[3] || DEFAULT_AREA, note: (m[4] || '').trim() });
    });
    return out;
  }

  function merged() {
    var seen = {}, out = [];
    shared.forEach(function (p) {
      if (seen[p.code]) return;
      seen[p.code] = 1;
      var o = ovr.filter(function (x) { return x.code === p.code; })[0];
      out.push({ code: p.code, name: o ? o.name : p.name, area: (o ? o.area : p.area) || DEFAULT_AREA, note: (o && o.note != null ? o.note : p.note) || '', mine: false, edited: !!o });
    });
    mine.forEach(function (p) { if (!seen[p.code]) { seen[p.code] = 1; out.push({ code: p.code, name: p.name, area: p.area || DEFAULT_AREA, note: p.note || '', mine: true }); } });
    return out;
  }

  function isFav(code) { return favs.indexOf(code) !== -1; }
  function isHidden(code) { return hidden.indexOf(code) !== -1; }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }

  function copyText(text, okMsg) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      toast(ok ? okMsg : '复制失败，请手动选中文字复制');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
    } else { fallback(); }
  }

  function areasOf() {
    var seen = {}, out = [];
    merged().forEach(function (p) {
      if (!showHidden && isHidden(p.code)) return;
      if (!seen[p.area]) { seen[p.area] = 1; out.push(p.area); }
    });
    return out.sort(function (a, b) { return a.localeCompare(b, 'zh'); });
  }

  function visible() {
    var kw = query.trim().toLowerCase();
    return merged().filter(function (p) {
      if (!showHidden && isHidden(p.code)) return false;
      if (area === '★ 收藏' && !isFav(p.code)) return false;
      if (area !== '全部' && area !== '★ 收藏' && p.area !== area) return false;
      if (!kw) return true;
      return (p.name + ' ' + p.area + ' ' + p.code).toLowerCase().indexOf(kw) !== -1;
    }).sort(function (x, y) {
      var fx = isFav(x.code), fy = isFav(y.code);
      if (fx !== fy) return fx ? -1 : 1;
      if (x.area !== y.area) return x.area.localeCompare(y.area, 'zh');
      return x.name.localeCompare(y.name, 'zh', { numeric: true });
    });
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // 位置照片：仓库里 photos/编号.jpg（找不到再试 png、jpeg、webp），没有就不显示
  var EXTS = ['jpg', 'png', 'jpeg', 'webp'];
  function photoFor(p) {
    var img = document.createElement('img');
    img.className = 'photo';
    img.alt = p.name + '的位置';
    img.hidden = true;
    var i = 0;
    function tryNext() {
      if (i >= EXTS.length) { if (img.parentNode) img.parentNode.removeChild(img); return; }
      img.src = 'photos/' + encodeURIComponent(p.code) + '.' + EXTS[i++];
    }
    img.onload = function () { img.hidden = false; };
    img.onerror = tryNext;
    img.addEventListener('click', function () {
      $('lb-img').src = img.src; $('lb-cap').textContent = p.name + ' · ' + p.code; $('lightbox').hidden = false;
    });
    tryNext();
    return img;
  }

  function renderChips() {
    var box = $('chips');
    box.textContent = '';
    var names = ['全部', '★ 收藏'].concat(areasOf());
    if (names.indexOf(area) === -1) area = '全部';
    names.forEach(function (n) {
      var b = el('button', 'chip', n);
      b.type = 'button';
      b.setAttribute('aria-pressed', n === area ? 'true' : 'false');
      b.addEventListener('click', function () { area = n; render(); });
      box.appendChild(b);
    });
  }

  function renderList() {
    var ul = $('list');
    ul.textContent = '';
    var all = merged().filter(function (p) { return showHidden || !isHidden(p.code); });
    var rows = visible();
    var nHidden = hidden.filter(function (c) { return merged().some(function (p) { return p.code === c; }); }).length;
    var tg = $('toggle-hidden');
    tg.hidden = nHidden === 0;
    tg.textContent = showHidden ? '收起已删除' : '已删除（' + nHidden + '）';
    $('count').textContent = '共 ' + rows.length + ' 个充电桩' + (rows.length !== all.length ? '（全部 ' + all.length + '）' : '');
    $('sync').textContent = syncMsg;
    if (!rows.length) {
      ul.appendChild(el('li', 'empty', all.length ? '没有符合条件的桩。换个关键词试试。' : (nHidden ? '桩都已删除，点下方“已删除”可恢复。' : '还没有桩。管理员在 piles.txt 里添加，或在下面添加自己的桩。')));
      return;
    }
    rows.forEach(function (p) {
      var li = el('li', 'row' + (isHidden(p.code) ? ' dim' : ''));
      var top = el('div', 'top');

      var fav = isFav(p.code);
      var star = el('button', 'star', fav ? '★' : '☆');
      star.type = 'button';
      star.setAttribute('aria-pressed', fav ? 'true' : 'false');
      star.setAttribute('aria-label', fav ? '取消收藏' : '收藏');
      star.addEventListener('click', function () {
        var i = favs.indexOf(p.code);
        if (i === -1) favs.push(p.code); else favs.splice(i, 1);
        writeJSON(K_FAVS, favs); render();
      });

      var name = el('div', 'name');
      name.appendChild(el('b', null, p.name));
      name.appendChild(el('span', null, p.area + (p.mine ? ' · 仅我可见' : (p.edited ? ' · 已修改' : ''))));

      top.appendChild(star);
      top.appendChild(photoFor(p));
      top.appendChild(name);
      top.appendChild(el('span', 'code', p.code));

      var acts = el('div', 'acts');
      var go = el('a', 'go', '查看空位');
      go.href = linkOf(p.code);
      go.target = '_blank';
      go.rel = 'noopener noreferrer';
      acts.appendChild(go);

      if (p.note) {
        var nb = el('button', 'ghost', openNotes[p.code] ? '收起说明' : '位置说明');
        nb.type = 'button';
        nb.addEventListener('click', function () { openNotes[p.code] = !openNotes[p.code]; renderList(); });
        acts.appendChild(nb);
      }

      if (!p.mine && !isHidden(p.code)) {
        var eb = el('button', 'ghost', '编辑');
        eb.type = 'button';
        eb.addEventListener('click', function () { startEdit(p); });
        acts.appendChild(eb);
        if (p.edited) {
          var rb = el('button', 'ghost', '还原');
          rb.type = 'button';
          rb.addEventListener('click', function () {
            ovr = ovr.filter(function (x) { return x.code !== p.code; });
            writeJSON(K_OVR, ovr); render(); toast('已还原');
          });
          acts.appendChild(rb);
        }
      }

      if (!p.mine) {
        var gone = isHidden(p.code);
        var confirming = pendingDelete === p.code;
        var hb = el('button', 'ghost' + (confirming ? ' warn' : ''), gone ? '恢复' : (confirming ? '确认删除' : '删除'));
        hb.type = 'button';
        hb.addEventListener('click', function () {
          if (gone) {
            hidden.splice(hidden.indexOf(p.code), 1);
            writeJSON(K_HIDDEN, hidden); render(); toast('已恢复');
          } else if (confirming) {
            hidden.push(p.code); pendingDelete = null;
            writeJSON(K_HIDDEN, hidden); render(); toast('已删除');
          } else {
            pendingDelete = p.code; renderList();
            setTimeout(function () { if (pendingDelete === p.code) { pendingDelete = null; renderList(); } }, 3000);
          }
        });
        acts.appendChild(hb);
      }

      if (p.mine) {
        var ed = el('button', 'ghost', '编辑');
        ed.type = 'button';
        ed.addEventListener('click', function () { startEdit(p); });
        acts.appendChild(ed);

        var del = el('button', 'ghost' + (pendingDelete === p.code ? ' warn' : ''), pendingDelete === p.code ? '确认删除' : '删除');
        del.type = 'button';
        del.addEventListener('click', function () {
          if (pendingDelete === p.code) {
            mine = mine.filter(function (x) { return x.code !== p.code; });
            pendingDelete = null; writeJSON(K_MINE, mine); render(); toast('已删除');
          } else {
            pendingDelete = p.code; renderList();
            setTimeout(function () { if (pendingDelete === p.code) { pendingDelete = null; renderList(); } }, 3000);
          }
        });
        acts.appendChild(del);
      }

      li.appendChild(top);
      li.appendChild(acts);
      if (p.note && openNotes[p.code]) li.appendChild(el('p', 'note', p.note));
      ul.appendChild(li);
    });
  }

  function allText() {
    return merged().map(function (p) { return [p.code, p.name.replace(/\s+/g, ''), p.area].concat(p.note ? [p.note.replace(/\s+/g, ' ')] : []).join(' '); }).join('\n');
  }

  function render() {
    renderChips();
    renderList();
    var dl = $('areas');
    dl.textContent = '';
    areasOf().forEach(function (a) { var o = document.createElement('option'); o.value = a; dl.appendChild(o); });
    $('backup').value = allText();
  }

  function upsertMine(code, name, areaName, note) {
    if (shared.some(function (p) { return p.code === code; })) return 'shared';
    var found = mine.filter(function (p) { return p.code === code; })[0];
    if (found) { found.name = name; found.area = areaName || DEFAULT_AREA; found.note = note || ''; return 'update'; }
    mine.push({ code: code, name: name, area: areaName || DEFAULT_AREA, note: note || '' });
    return 'add';
  }

  function showCodeField(show) {
    $('f-code').closest('label').hidden = !show;
    $('f-code').readOnly = !show;
  }

  function startEdit(p) {
    $('addBox').open = true;
    $('f-code').value = p.code;
    showCodeField(p.mine);
    $('f-name').value = p.name;
    $('f-area').value = p.area === DEFAULT_AREA ? '' : p.area;
    $('f-note').value = p.note || '';
    $('f-submit').textContent = '更新';
    $('addBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
    $('f-name').focus();
  }

  $('addBox').addEventListener('toggle', function () {
    if (!this.open) { $('form').reset(); showCodeField(true); $('f-submit').textContent = '保存'; }
  });

  $('q').addEventListener('input', function (e) { query = e.target.value; renderList(); });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = normCode($('f-code').value);
    var name = $('f-name').value.trim();
    if (!validCode(code)) { toast('编号只能含字母、数字，3到32位'); return; }
    if (!name) { toast('请填写名称'); return; }
    var note = $('f-note').value.trim();
    var r = upsertMine(code, name, $('f-area').value.trim(), note);
    if (r === 'shared') {
      var base = shared.filter(function (x) { return x.code === code; })[0];
      var a = $('f-area').value.trim() || DEFAULT_AREA;
      ovr = ovr.filter(function (x) { return x.code !== code; });
      if (name !== base.name || a !== (base.area || DEFAULT_AREA) || note !== (base.note || '')) ovr.push({ code: code, name: name, area: a, note: note });
      writeJSON(K_OVR, ovr); render();
      $('form').reset(); showCodeField(true); $('f-submit').textContent = '保存';
      toast('已修改');
      return;
    }
    writeJSON(K_MINE, mine); render();
    $('form').reset(); showCodeField(true); $('f-submit').textContent = '保存';
    toast(r === 'add' ? '已添加' : '已更新');
  });

  $('bulk-go').addEventListener('click', function () {
    var items = parseText($('bulk').value);
    var add = 0, upd = 0, skip = 0, bad = 0;
    items.forEach(function (it) {
      if (!it) { bad++; return; }
      var r = upsertMine(it.code, it.name, it.area, it.note);
      if (r === 'add') add++; else if (r === 'update') upd++; else skip++;
    });
    writeJSON(K_MINE, mine); render();
    if (add + upd) $('bulk').value = '';
    toast('新增 ' + add + '，更新 ' + upd + (skip ? '，' + skip + ' 个已在共享列表' : '') + (bad ? '，' + bad + ' 行格式不对' : ''));
  });

  $('lightbox').addEventListener('click', function () { this.hidden = true; $('lb-img').removeAttribute('src'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('lightbox').hidden = true; });

  // 管理员模式：网址后面加 ?admin=1 才显示“导出”，?admin=0 关闭
  (function () {
    var on = false;
    try {
      var v = new URLSearchParams(location.search).get('admin');
      if (v === '1') localStorage.setItem('charge-admin', '1');
      if (v === '0') localStorage.removeItem('charge-admin');
      on = localStorage.getItem('charge-admin') === '1';
    } catch (e) { on = /[?&]admin=1/.test(location.search); }
    $('adminBox').hidden = !on;
  })();

  // 在仓库里找图片：依次试 jpg、png、jpeg，找到就回调它的文件名
  function findImage(base, cb) {
    var exts = ['jpg', 'png', 'jpeg'], i = 0;
    (function next() {
      if (i >= exts.length) return;
      var url = base + '.' + exts[i++];
      var probe = new Image();
      probe.onload = function () { cb(url); };
      probe.onerror = next;
      probe.src = url;
    })();
  }

  // 联系作者：仓库里有 contact.jpg（或 png）才显示按钮
  findImage('contact', function (url) {
    var b = $('contact');
    b.hidden = false;
    b.addEventListener('click', function () {
      $('lb-img').src = url;
      $('lb-cap').textContent = '扫码添加，桩的位置有误或想补充新桩都可以找我';
      $('lightbox').hidden = false;
    });
  });

  // 赞赏：仓库里有 donate.jpg（或 png）才显示按钮
  findImage('donate', function (url) {
    var b = $('donate');
    b.hidden = false;
    b.addEventListener('click', function () {
      $('lb-img').src = url;
      $('lb-cap').textContent = '微信扫码，自愿赞赏，不赞赏也不影响使用';
      $('lightbox').hidden = false;
    });
  });

  $('toggle-hidden').addEventListener('click', function () { showHidden = !showHidden; render(); });

  $('backup-copy').addEventListener('click', function () { copyText(allText(), '已复制全部桩'); });

  function loadShared() {
    if (!window.fetch) { syncMsg = '列表：使用上次缓存'; render(); return; }
    fetch('piles.txt?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (text) {
        shared = parseText(text).filter(Boolean);
        writeJSON(K_SHARED, shared);
        syncMsg = '列表已更新';
        render();
      })
      .catch(function () {
        syncMsg = shared.length ? '读取失败，显示上次缓存' : '列表读取失败';
        render();
      });
  }

  initLocal();
  render();
  loadShared();
})();
</script>
</body>
</html>
